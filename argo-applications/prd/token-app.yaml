apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: token-app-prd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/shivagande26/argocd-helm-promotion-proj.git'
    targetRevision: HEAD
    path: charts/token-service
    helm:
      valueFiles:
        - ../../environments/prd/values-prd.yaml
  destination:
    name: production
    namespace: default
  syncPolicy:
    automated: null
