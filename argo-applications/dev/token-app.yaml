apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: token-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/shivagande26/argocd-helm-promotion-proj.git'
    targetRevision: HEAD
    path: charts/token-service
    helm:
      valueFiles:
        - ../../environments/dev/values-dev.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true