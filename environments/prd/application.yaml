apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-mgmt-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com'
    targetRevision: HEAD
    path: charts/user-mgmt-service
    helm:
      valueFiles:
        - ../../environments/prod/values-prd.yaml
  destination:
    server: 'https://<PROD_CLUSTER_API_ENDPOINT>:6443'
    namespace: default
  syncPolicy:
    automated: null
